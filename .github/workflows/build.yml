name: 'build-streamlurker'

on:
  push:
    branches:
      - v2

jobs:
  build:
    if: startsWith(github.event.head_commit.message, 'Release ')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            artifact: 'app-macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            artifact: 'app-macos-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            artifact: 'app-linux'
          - platform: 'windows-latest'
            args: ''
            artifact: 'app-windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Bun installation for Linux and macOS
      - name: install bun (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "${HOME}/.bun/bin" >> $GITHUB_PATH

      # Bun installation for Windows
      - name: install bun (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iwr https://bun.sh/install.ps1 -useb | iex
          echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install
        shell: bash

      - name: build tauri app
        run: bun run tauri build ${{ matrix.args }}
        shell: bash

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle
